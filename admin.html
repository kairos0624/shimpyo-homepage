<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>쉼표 예약 관리</title><style>body{margin:0;background:#f8f6ef;font-family:system-ui,-apple-system,sans-serif;color:#344a38}header{background:#e6ede3;padding:24px max(18px,calc((100vw - 1100px)/2))}main{max-width:1100px;margin:auto;padding:24px 18px}h1{margin:0 0 8px}button,select{font:inherit;border-radius:10px;padding:9px 12px;border:1px solid #b9cbb8;background:white}button{cursor:pointer}button.primary{background:#56765c;color:white}.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:18px 0}.cards{display:grid;gap:14px}.card{background:white;padding:20px;border-radius:17px;box-shadow:0 4px 18px #243f1a0a;border:1px solid #e5e9df}.meta{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0;color:#536653}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.pill{background:#edf2e9;padding:4px 9px;border-radius:12px}.warn{color:#9b543e}.small{font-size:13px;color:#667265}</style></head><body><header><h1>심리상담 쉼표 · 예약 관리</h1><div>신청 내역 확인 · 승인 · 거절 · 중복 승인 방지</div></header><main><div class="toolbar"><label>상태 <select id="filter"><option value="all">전체</option><option value="pending">대기</option><option value="approved">승인</option><option value="rejected">거절</option></select></label><button onclick="load()">새로고침</button><button onclick="logout()">로그아웃</button></div><p id="msg" role="status"></p><div id="cards" class="cards"></div><p class="small">예약 승인·거절은 관리자 화면의 상태 변경입니다. 신청자에게 자동 문자나 이메일은 발송되지 않으므로 별도로 연락해 주세요. 개인정보 보관 기간과 삭제 기준을 정해 운영해 주세요.</p></main><script>let token='',items=[];const cards=document.getElementById('cards'),msg=document.getElementById('msg');function el(tag,txt){const e=document.createElement(tag);e.textContent=txt;return e}async function load(){try{const [a,b]=await Promise.all([fetch('/api/admin/csrf'),fetch('/api/admin/reservations')]);if(!a.ok||!b.ok){location.href='/admin/login';return}token=(await a.json()).token;items=await b.json();render()}catch(e){msg.textContent='서버 연결을 확인해 주세요.'}}function render(){cards.replaceChildren();const shown=items.filter(x=>document.getElementById('filter').value==='all'||x.status===document.getElementById('filter').value);msg.textContent='표시된 신청: '+shown.length+'건';shown.forEach(x=>{const card=el('article','');card.className='card';const title=el('h3',x.day+' '+x.slot+' · '+x.program);card.append(title);const line=el('div','접수번호 '+x.receipt+' · '+x.name+' · '+x.phone);line.className='meta';card.append(line);const state=el('span',({pending:'승인 대기',approved:'승인 완료',rejected:'거절'}[x.status]||x.status));state.className='pill';card.append(state);card.append(el('p','신청일: '+x.created_at));const actions=el('div','');actions.className='actions';for(const [value,label] of [['approved','승인'],['rejected','거절'],['pending','대기로 변경']]){const btn=el('button',label);if(value==='approved')btn.className='primary';btn.disabled=x.status===value;btn.onclick=()=>change(x.id,value);actions.append(btn)}const del=el('button','개인정보 삭제');del.className='warn';del.onclick=()=>remove(x.id);actions.append(del);card.append(actions);cards.append(card)});if(!shown.length)cards.append(el('p','표시할 예약 신청이 없습니다.'))}async function action(url){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':token},body:JSON.stringify(action.payload||{})});const data=await r.json();if(!r.ok)throw Error(data.error||'처리하지 못했습니다.')}async function change(id,status){if(!confirm('예약 상태를 변경하시겠습니까?'))return;try{action.payload={status};await action('/api/admin/reservations/'+id+'/status');await load()}catch(e){alert(e.message)}}async function remove(id){if(!confirm('이 신청과 개인정보를 영구 삭제하시겠습니까?'))return;try{action.payload={};await action('/api/admin/reservations/'+id+'/delete');await load()}catch(e){alert(e.message)}}async function logout(){action.payload={};await action('/admin/logout');location.href='/admin/login'}document.getElementById('filter').onchange=render;load();</script></body></html>
