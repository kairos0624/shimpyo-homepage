name: Check Shimpyo shop redirect

on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-shop-redirect.yml'

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check the public 301 redirect
        run: |
          actual=$(curl --silent --show-error --retry 3 --retry-delay 10 \
            --retry-max-time 120 --max-time 30 --output /dev/null \
            --write-out '%{http_code} %{redirect_url}' \
            'https://xn--4s4by04a.shop/?uptime_check=1')
          expected='301 https://xn--4s4by04a.site/?uptime_check=1'
          if [[ "$actual" != "$expected" ]]; then
            printf 'Unexpected response: %s\n' "$actual" >&2
            exit 1
          fi
          printf 'Verified: %s\n' "$actual"
